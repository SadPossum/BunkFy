version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Action pins, approval manifests and policy checks are updated together.
    ignore:
      - dependency-name: "SadPossum/GMA-Skeleton/.github/actions/security-baseline"
      - dependency-name: "SadPossum/GMA-Skeleton/.github/actions/source-release-evidence"
    groups:
      compatible-actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet-patches:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
