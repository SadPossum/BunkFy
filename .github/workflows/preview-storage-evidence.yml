name: Preview infrastructure and storage evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths:
      - apps/backend
      - deploy/preview/compose.yaml
      - deploy/preview/compose.infrastructure.yaml
      - deploy/preview/.env.example
      - .gma/preview-storage-review.json
      - .gma/preview-infrastructure-profiles.json
      - .gma/preview-infrastructure-review.json
      - eng/operations/check-preview-storage-security*
      - eng/operations/check-preview-infrastructure-security*
      - deploy/preview/postgres.Dockerfile
      - eng/operations/prepare-preview-postgres.py
      - eng/operations/collect-preview-infrastructure.py
      - eng/operations/preview-infrastructure.common.ps1
      - eng/new-preview-env.ps1
      - eng/operations/probe-preview-storage*
      - eng/operations/install-probe-trivy.py
      - eng/operations/fixtures/preview-storage-reviewed-evidence.json.gz
      - eng/operations/fixtures/preview-infrastructure-reviewed-evidence.json.gz
      - .github/workflows/preview-storage-evidence.yml

permissions:
  contents: read

concurrency:
  group: preview-storage-probe-${{ github.ref }}
  cancel-in-progress: false

env:
  STORAGE_IMAGE: pgsty/silo:RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed probe only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Resolve the committed backend storage-gate owner
        id: backend
        run: |
          test "$(git ls-tree HEAD apps/backend | awk '{print $1}')" = 160000
          backend_sha="$(git rev-parse HEAD:apps/backend)"
          [[ "$backend_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$backend_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout only the exact owning storage helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SadPossum/BunkFy.Backend
          ref: ${{ steps.backend.outputs.sha }}
          path: apps/backend
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /eng/operations/check-preview-storage-security.py
            /eng/operations/inspect-preview-storage-parser.py
            /eng/operations/image-config-digest.py

      - name: Pull the exact reviewed Linux provider
        run: docker pull --platform linux/amd64 "$STORAGE_IMAGE"

      - name: Exercise authentic-report security boundaries without containers
        run: |
          python3 eng/operations/probe-preview-storage.tests.py
          python3 eng/operations/check-preview-storage-security.tests.py
          python3 eng/operations/check-preview-infrastructure-security.tests.py

      - name: Install pinned local scanner
        run: python3 eng/operations/install-probe-trivy.py

      - name: Prepare the isolated Docker image exporter
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Scan the five exact infrastructure images and verify actual PostgreSQL context
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: python3 eng/operations/collect-preview-infrastructure.py

      - name: Record all raw high and critical security findings
        id: scan
        continue-on-error: true
        run: |
          mkdir -p artifacts
          set +e
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/silo-security.json "$STORAGE_IMAGE"
          scan_status=$?
          echo "exit_code=$scan_status" >> "$GITHUB_OUTPUT"
          exit "$scan_status"

      - name: Retain provider component inventory
        run: trivy image --format cyclonedx --output artifacts/silo-sbom.cdx.json "$STORAGE_IMAGE"

      - name: Probe signed S3, denial, restart persistence and cleanup
        run: python3 eng/operations/probe-preview-storage.py

      - name: Require zero unresolved findings with exact source and binary fix evidence
        if: always()
        env:
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: python3 eng/operations/check-preview-storage-security.py --scanner-exit-code "$SCAN_EXIT_CODE"

      - name: Require fresh infrastructure findings, current advisories and enforced PostgreSQL context
        if: always()
        run: python3 eng/operations/check-preview-infrastructure-security.py

      - name: Retain minimized qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bunkfy-preview-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 30
