name: Security Baseline

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Product source, dependency and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete product source set
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GMA_CI_TOKEN || github.token }}
          persist-credentials: false

      - name: Validate repository security policy
        shell: pwsh
        run: ./eng/check-repository-security.ps1

      - name: Validate repository release policy
        shell: pwsh
        run: ./eng/check-repository-release.ps1

      - name: Validate product image evidence policy
        shell: pwsh
        run: ./eng/check-product-image-evidence.ps1

      - name: Run pinned GMA repository security baseline
        uses: SadPossum/GMA-Skeleton/.github/actions/security-baseline@02210e3379976fd342251ffd6d967bbb541b7384
        with:
          exception-file: .gma/security-exceptions.json

      - name: Publish code-scanning evidence
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: artifacts/security/trivy-results.sarif
          category: trivy-bunkfy-product-source

      - name: Retain security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-evidence-${{ github.sha }}
          path: artifacts/security
          if-no-files-found: error
          retention-days: 30
