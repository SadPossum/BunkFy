name: Preview infrastructure advisory inventory

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed inventory commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: preview-infrastructure-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the reviewed inventory code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Install the checksum-verified scanner
        run: python3 eng/operations/install-probe-trivy.py
      - name: Inspect all current pinned infrastructure images
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_head }}
        run: python3 eng/operations/inventory-preview-infrastructure.py
      - name: Retain current subjects, raw findings and inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bunkfy-infrastructure-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/infrastructure/*.json
          if-no-files-found: error
          retention-days: 7
