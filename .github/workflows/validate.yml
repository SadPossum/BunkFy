name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.403

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Bootstrap
        shell: pwsh
        run: ./eng/bootstrap.ps1

      - name: Check Preview storage security evidence boundaries
        run: |
          python3 eng/operations/probe-preview-storage.tests.py
          python3 eng/operations/check-preview-storage-security.tests.py
          python3 eng/operations/check-preview-infrastructure-security.tests.py

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install chromium

      - name: Verify
        shell: pwsh
        run: ./eng/verify.ps1
