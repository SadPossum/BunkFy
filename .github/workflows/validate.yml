name: NATS state compatibility probe

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed state probe commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: preview-state-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the reviewed probe code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Install only the hash-pinned official protocol client for the probe
        run: |
          python3 -m pip install --only-binary=:all: --no-deps --require-hashes --target "$RUNNER_TEMP/nats-probe" --requirement eng/operations/fixtures/nats-probe-requirements.txt
      - name: Prove NATS state, durable acknowledgements, new server and cold restore
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_head }}
          PYTHONPATH: ${{ runner.temp }}/nats-probe
        run: python3 eng/operations/probe-preview-state-compatibility.py --phase nats
      - name: Retain exact subjects, raw findings, observations and cleanup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bunkfy-nats-state-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/state-compatibility/*
          if-no-files-found: error
          retention-days: 30
