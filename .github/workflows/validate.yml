name: PostgreSQL nonroot data compatibility probe

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed PostgreSQL probe commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: postgres-context-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the reviewed probe code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Prove old data, nonroot startup, restart, backup restore and actual helper context
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_head }}
        run: python3 eng/operations/probe-postgres-nonroot-compatibility.py
      - name: Retain exact subjects, context, data observations and cleanup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bunkfy-postgres-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/postgres-context/*
          if-no-files-found: error
          retention-days: 30
