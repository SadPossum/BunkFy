name: PostgreSQL helper reachability evidence

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed analysis commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: postgres-helper-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the reviewed analysis code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Inspect the exact helper with the official Go analyzer
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_head }}
        run: python3 eng/operations/review-postgres-helper.py
      - name: Retain exact subjects and raw symbol evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bunkfy-postgres-helper-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/postgres-helper/*
          if-no-files-found: error
          retention-days: 30
